name: CI

# Unit tests run on GitHub-hosted runners so they never occupy the self-hosted
# runner, which is reserved for jobs that touch real data (see pipeline.yml).
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# A newer push to the same branch/PR supersedes the running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Python 3.11 and Java 8 match the VM runner (Spark 3.5.0), so the Spark tests here
      # exercise the same versions as production.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up Java (for PySpark)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      # The dashboard requirements are installed too, so its data helpers are tested.
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dashboard.txt

      - name: Run unit tests
        run: pytest -q
