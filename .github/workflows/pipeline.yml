name: Data Pipeline

# Medallion pipeline on the self-hosted runner. Each layer is a job with `needs:` on the
# previous one, so it only runs after that succeeds and can be re-run individually:
# bronze -> bronze_chaos -> silver (Gold will follow the same pattern).
#
# Environment follows the branch: runs from main write to <data root>/prod (the cron
# schedule only fires on main), manual runs from dev write to <data root>/dev.

on:
  schedule:
    # Runs daily at 02:00 UTC (after previous day hourly observations are fully settled).
    # Scheduled runs re-check the last 3 days: missed runs are filled in and MET Norway
    # QC revisions become new Bronze versions; unchanged days are skipped via checksum.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Single date (YYYY-MM-DD). Leave all date fields blank for the default lookback.'
        required: false
        default: ''
      start_date:
        description: 'Backfill start date (YYYY-MM-DD, inclusive)'
        required: false
        default: ''
      end_date:
        description: 'Backfill end date (YYYY-MM-DD, inclusive, default yesterday UTC)'
        required: false
        default: ''
      lookback_days:
        description: 'Days to re-check ending yesterday (used when no dates are given)'
        required: false
        default: '3'
      dry_run:
        description: 'Dry Run (test extraction without saving to disk)'
        required: false
        default: false
        type: boolean

# Never let two runs of the same environment write at the same time; dev runs never block prod.
concurrency:
  group: data-pipeline-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  bronze:
    name: Bronze Ingestion
    runs-on: self-hosted
    timeout-minutes: 120
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      DAT535_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      DAT535_DATA_DIR: /home/ubuntu/spark-project-data
      FROST_CLIENT_ID: ${{ secrets.FROST_CLIENT_ID }}
      # Inputs are passed via env (not inlined into the script) to prevent shell injection.
      IN_TARGET_DATE: ${{ github.event.inputs.target_date }}
      IN_START_DATE: ${{ github.event.inputs.start_date }}
      IN_END_DATE: ${{ github.event.inputs.end_date }}
      IN_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
      IN_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      # main writes prod, dev writes dev; any other branch is refused before touching data.
      - name: Guard branch
        run: |
          case "$GITHUB_REF_NAME" in
            main|dev) ;;
            *) echo "::error::Data workflows only run from main (prod) or dev (dev), not '$GITHUB_REF_NAME'"; exit 1 ;;
          esac
          if [ "$DAT535_ENV" = "prod" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Only main may write to prod"; exit 1
          fi
          echo "Environment: $DAT535_ENV -> $DAT535_DATA_DIR/$DAT535_ENV"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          source ~/spark-env/bin/activate
          pip install -r requirements.txt

      # Spark tests run in CI; skipping them here keeps a SparkSession start-up out of every ingestion.
      - name: Run unit tests
        run: |
          source ~/spark-env/bin/activate
          pytest -q -m "not spark"

      - name: Run Bronze Ingestion
        run: |
          set -euo pipefail
          source ~/spark-env/bin/activate
          mkdir -p "$DAT535_DATA_DIR/$DAT535_ENV/bronze"

          date_re='^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          ARGS=()
          if [ -n "$IN_TARGET_DATE" ]; then
            [[ "$IN_TARGET_DATE" =~ $date_re ]] || { echo "Invalid target_date"; exit 2; }
            ARGS+=(--date "$IN_TARGET_DATE")
          elif [ -n "$IN_START_DATE" ]; then
            [[ "$IN_START_DATE" =~ $date_re ]] || { echo "Invalid start_date"; exit 2; }
            ARGS+=(--start-date "$IN_START_DATE" --request-delay 0.5)
            if [ -n "$IN_END_DATE" ]; then
              [[ "$IN_END_DATE" =~ $date_re ]] || { echo "Invalid end_date"; exit 2; }
              ARGS+=(--end-date "$IN_END_DATE")
            fi
          else
            [[ "$IN_LOOKBACK_DAYS" =~ ^[0-9]+$ ]] || { echo "Invalid lookback_days"; exit 2; }
            ARGS+=(--lookback-days "$IN_LOOKBACK_DAYS")
          fi
          if [ "$IN_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          echo "=== Executing Bronze Ingestion: ${ARGS[*]} ==="
          python src/ingestion/ingest_daily.py "${ARGS[@]}"

      - name: Write GitHub Step Summary
        if: always()
        run: |
          echo "## Bronze Ingestion Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${DAT535_ENV} (branch ${{ github.ref_name }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| Run Number | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Target Date | ${IN_TARGET_DATE:-–} |" >> $GITHUB_STEP_SUMMARY
          echo "| Range | ${IN_START_DATE:-–} → ${IN_END_DATE:-–} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lookback Days | ${IN_LOOKBACK_DAYS} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dry Run | ${IN_DRY_RUN} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bronze Directory | $DAT535_DATA_DIR/$DAT535_ENV/bronze |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered By | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY

  bronze_chaos:
    name: Bronze Chaos Copy
    needs: bronze
    # Nothing new is written to Bronze on a dry run, so there is nothing to copy.
    if: github.event.inputs.dry_run != 'true'
    runs-on: self-hosted
    timeout-minutes: 60
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      DAT535_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      DAT535_DATA_DIR: /home/ubuntu/spark-project-data

    steps:
      # main writes prod, dev writes dev; any other branch is refused before touching data.
      - name: Guard branch
        run: |
          case "$GITHUB_REF_NAME" in
            main|dev) ;;
            *) echo "::error::Data workflows only run from main (prod) or dev (dev), not '$GITHUB_REF_NAME'"; exit 1 ;;
          esac
          if [ "$DAT535_ENV" = "prod" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Only main may write to prod"; exit 1
          fi
          echo "Environment: $DAT535_ENV -> $DAT535_DATA_DIR/$DAT535_ENV"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Inject errors into Bronze copy
        run: |
          set -euo pipefail
          source ~/spark-env/bin/activate
          # Only Bronze files not yet in bronze_chaos/ are processed (default 1% rate, seed 42).
          python src/ingestion/chaos_injector.py

  silver:
    name: Silver Layer
    # Skipped whenever bronze_chaos is (dry runs): there is nothing new to clean.
    needs: bronze_chaos
    runs-on: self-hosted
    timeout-minutes: 60
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      DAT535_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      DAT535_DATA_DIR: /home/ubuntu/spark-project-data

    steps:
      # main writes prod, dev writes dev; any other branch is refused before touching data.
      - name: Guard branch
        run: |
          case "$GITHUB_REF_NAME" in
            main|dev) ;;
            *) echo "::error::Data workflows only run from main (prod) or dev (dev), not '$GITHUB_REF_NAME'"; exit 1 ;;
          esac
          if [ "$DAT535_ENV" = "prod" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Only main may write to prod"; exit 1
          fi
          echo "Environment: $DAT535_ENV -> $DAT535_DATA_DIR/$DAT535_ENV"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Silver tables
        run: |
          set -euo pipefail
          source ~/spark-env/bin/activate
          # Rebuilds every Silver table from bronze_chaos/ (SILVER_INPUT) and writes the step summary.
          # Exit code 1 = a hard check failed and nothing was written (the previous Silver stays).
          python src/silver/run_silver.py
